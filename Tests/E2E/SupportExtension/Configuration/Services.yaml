services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  ViewMend\Typo3SiteTrackerE2E\:
    resource: '../Classes/*'

  ViewMend\Typo3SiteTracker\Transport\ViewMendClientFactoryInterface:
    alias: ViewMend\Typo3SiteTrackerE2E\TestViewMendClientFactory

  ViewMend\Typo3SiteTrackerE2E\ScenarioCommand:
    tags:
      - name: 'console.command'
        command: 'viewmend-e2e:scenario'
        description: 'Run the isolated ViewMend Site Tracker end-to-end scenario.'
        schedulable: false
